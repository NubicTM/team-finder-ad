{% extends 'base.html' %}
{% load static %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Вход в систему</h2>
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" required class="form-control">
            </div>
            
            <div class="form-group">
                <label for="id_password">Пароль</label>
                <input type="password" name="password" id="id_password" required class="form-control">
            </div>
            
            {% if form.non_field_errors %}
            <div class="form-errors">
                {% for error in form.non_field_errors %}
                    <p class="error">{{ error }}</p>
                {% endfor %}
            </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
        <p class="auth-link">Нет аккаунта? <a href="/users/register/">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
